<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Confirmação – Casa Concreto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #724D9F;
            --text-dark: #2a2a2a;
            --text-muted: #6f6f6f;
            --bg-light: #f7f5fb;
            --white: #ffffff;
            --card-bg: #ffffff;
            --font-main: "Sora", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 900px;
            animation: slideUp 0.8s ease forwards 0.2s;
            opacity: 0;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid #e6e0f0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .logo {
            width: 260px;
            max-width: 80%;
        }

        iframe {
            width: 100%;
            height: 70vh;
            border: none;
            border-radius: 12px;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 24px 18px;
                gap: 20px;
            }

            .logo {
                width: 70%;
                max-width: 200px;
            }

            iframe {
                height: 65vh;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">

            <img src="./logo.png" alt="Logo Casa Concreto" class="logo">

            <iframe src="https://app.pipefy.com/public/form/fywy2Ljd?embedded=true"></iframe>

        </div>
    </div>
</body>

</html>
