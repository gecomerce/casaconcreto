<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Convite – Lançamento Casa Concreto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="/convite/logo2.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #724D9F;
            --text-dark: #2a2a2a;
            --text-muted: #6f6f6f;
            --bg-light: #f7f5fb;
            --white: #ffffff;
            --card-bg: #ffffff;
            --font-main: "Sora", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .container {
            max-width: 900px;
            width: 100%;
            transform: translateY(20px);
            animation: slideUp 0.8s ease forwards 0.2s;
            opacity: 0;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            place-items: center;
            /* Centraliza horizontal e vertical */
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #e6e0f0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 40px;
            min-height: 80vh;
        }

        .logo {
            width: 300px;
            margin-bottom: 20px;
        }

        iframe {
            width: 100%;
            height: 70vh;
            border: none;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="card">

            <img src="./logo.png" alt="" class="logo">

            <iframe src='https://app.pipefy.com/public/form/fywy2Ljd?embedded=true' frameborder='0'></iframe>

        </div>
    </div>
</body>

</html>
