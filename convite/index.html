<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Convite Casa Concreto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="logo2.png" type="image/x-icon">

    <style>
        :root {
            --primary: #793CBD;
            --text-dark: #2a2a2a;
            --text-muted: #6f6f6f;
            --bg-light: #f7f5fb;
            --white: #ffffff;
            --card-bg: #ffffff;
            --font-main: "Sora", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .container {
            width: 100%;
            border-radius: 20px;
            max-width: 1100px;
            animation: slideUp 0.8s ease forwards 0.2s;
            opacity: 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 2fr 2fr;
            border: 1px solid #e6e0f0;
            /* box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4); */
        }

        .map-button {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: 0.25s ease;
        }

        .map-button:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(114, 77, 159, 0.25);
        }


        /* MOBILE */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .card {
                grid-template-columns: 1fr;
            }
        }

        .left {
            padding: 40px;
            animation: fadeLeft 0.8s ease forwards 0.4s;
            opacity: 0;
        }

        @keyframes fadeLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .right {
            background: linear-gradient(180deg, #f3ecff 0%, #e8def7 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: fadeRight 0.8s ease forwards 0.4s;
            opacity: 0;
            background-image: url('casa-final.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        @keyframes fadeRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .tag {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(114, 77, 159, 0.12);
            border: 1px solid rgba(114, 77, 159, 0.3);
            color: var(--primary);
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 18px;
            animation: tagPulse 2.4s ease-in-out infinite;
        }

        @keyframes tagPulse {
            50% {
                box-shadow: 0 0 12px rgba(114, 77, 159, 0.35);
                transform: scale(1.03);
            }
        }

        h1 {
            font-size: 32px;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        h1 span {
            color: var(--primary);
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 28px;
            max-width: 480px;
        }

        .details {
            display: grid;
            gap: 18px;
            margin-bottom: 30px;
        }

        .detail-item {
            border-top: 1px solid #e6e0f0;
            padding-top: 10px;
        }

        .detail-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--text-muted);
        }

        .detail-value {
            font-size: 14px;
        }

        .cta-button {
            display: inline-block;
            padding: 14px 26px;
            border-radius: 999px;
            background: var(--primary);
            color: var(--white);
            font-weight: 600;
            text-transform: uppercase;
            text-decoration: none;
            transition: 0.25s ease;
            box-shadow: 0 10px 25px rgba(114, 77, 159, 0.3);
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            background: #8c63c4;
            transform: translateY(-3px);
        }

        .cta-note {
            display: block;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .logo {
            width: 200px;
            margin-bottom: 20px;
        }


        .footer-note {
            /* background-color: rgba(121, 60, 189, 0.15); */
            /* background-color: var(--primary); */
            border-radius: 999px;;
            padding: 8px;
            font-size: 12px;
            color: var(--text-dark);
            font-weight: bold;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }

        /* ---------------------------------------------------------- */

        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .container {
                max-width: 100%;
                box-shadow: none;
                border-radius: 0;
            }

            .card {
                grid-template-columns: 1fr;
                border-radius: 0;
            }

            .left {
                padding: 24px;
                text-align: center;
            }

            .right {
                background-image: url('casa-final.png');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                min-height: 400px;
                padding: 24px;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                align-items: center;
            }

            .logo {
                width: 160px;
                position: absolute;
                top: 25px;
            }

            .footer-note {
                font-size: 12px;
                text-align: center;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .cta-button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">

            <div class="left">
                <div class="tag">Lançamento exclusivo</div>

                <h1>
                    Convite para o lançamento<br />
                    do projeto <span>Casa Concreto</span>
                </h1>

                <p class="subtitle">
                    O Mercado da construção civil está prestes a ser transformado!
                </p>

                <div class="details">
                    <div class="detail-item">
                        <div class="detail-label">Data</div>
                        <div class="detail-value">Data</div>
                    </div>

                    <div class="detail-item">
                        <div class="detail-label">Horário</div>
                        <div class="detail-value">hora</div>
                    </div>

                    <div class="detail-item">

                        <div class="detail-label">Local</div>

                        <div class="detail-value">Local – Franca/SP</div>

                        <a class="map-button" href="https://maps.app.goo.gl/HLgHL9XLAj1Nf6qu7" target="_blank"
                            rel="noopener noreferrer">
                            Abrir no mapa
                        </a>
                        
                    </div>

                </div>

                <a href="./confirmar.html" class="cta-button">Confirmar presença</a>
                <span class="cta-note">Confirme até:</span>
                <div class="detail-value">Data</div>
            </div>

            <div class="right">

                <img src="logo.png" class="logo">


                <div class="footer-note">
                    * Evento exclusivo para convidados
                </div>
            </div>


        </div>
    </div>
</body>

</html>
